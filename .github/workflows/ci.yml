name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Check (format, lint, types)
        run: pnpm --dir frontend check

      - name: Test
        run: pnpm --dir frontend exec vp test run

      - name: Build
        run: pnpm --dir frontend build

  macos:
    name: Go checks and app bundle
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Install nasm (bundled ffmpeg, x86_64)
        run: brew install nasm

      - name: Build universal app bundle
        run: make app-universal

      - name: Verify signature
        run: codesign --verify --deep --strict bin/PicPress.app

      - name: Archive app
        run: ditto -c -k --norsrc --keepParent bin/PicPress.app PicPress.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PicPress-app
          path: PicPress.app.zip
          if-no-files-found: error
