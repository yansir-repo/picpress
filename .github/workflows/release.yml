name: Release

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "build/appicon.png"
      - "build/darwin/icons.icns"
      - "Makefile"
      - "Taskfile.yml"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump, build and publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Bump version
        id: version
        run: |
          VERSION="$(python3 scripts/bump-version.py)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

      - name: Install nasm (bundled ffmpeg, x86_64)
        run: brew install nasm

      - name: Build universal app
        run: make app-universal

      - name: Archive app
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ditto -c -k --norsrc --keepParent bin/PicPress.app "PicPress-${VERSION}-macOS-universal.zip"

      - name: Commit version bump and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION build/darwin/Info.plist
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "PicPress v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PicPress v${{ steps.version.outputs.version }}
          files: |
            PicPress-${{ steps.version.outputs.version }}-macOS-universal.zip
            .bin/ffmpeg-*/ffmpeg-*.tar.xz
          generate_release_notes: true
