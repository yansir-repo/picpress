version: '3'

tasks:
  build:
    summary: Build the PicPress binary (including the frontend)
    cmds:
      - make build

  package:
    summary: Build PicPress.app
    cmds:
      - make app

  run:
    summary: Run PicPress with the Vite dev server
    cmds:
      - make dev

  test:
    summary: Run Go and frontend tests
    cmds:
      - make test
